# 그누보드7 웹 프론트 (정적 + PHP-FPM 프록시)
# 진입점: public/index.php — 문서 루트는 반드시 public/
# 주의: /api/*.json·번들·에셋 등 동적 응답도 정적 확장자로 끝나므로,
# 전역 확장자 매칭에 캐시 헤더를 달지 않는다 (/build/ 산출물에만 적용).
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # 업로드 상한 (php.ini 와 맞춤)
    client_max_body_size 24M;

    # 빌드 산출물만 장기 캐시 (해시 파일명이라 immutable)
    location ^~ /build/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    # 민감 파일 차단
    location ~ /\.(env|git) {
        deny all;
    }
}
