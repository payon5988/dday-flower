; 그누보드7 운영 권장값 (docs/requirements.md §1.5)
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 120
date.timezone = UTC
expose_php = Off

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
; 배포는 이미지 교체 방식이므로 파일 변경 감시 불필요.
; (볼륨 마운트 개발 시에는 1로 바꿀 것)
